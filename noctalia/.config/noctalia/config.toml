config_version = 13

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[backdrop]
enabled        = true
blur_intensity = 0.5    # 0.0 (no blur) to 1.0 (max blur)
tint_intensity = 0.4    # 0.0 (no tint) to 1.0 (opaque tint)

[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.6
position             = "top"
margin_ends          =  100   
margin_edge          = 8
concave_edge_corners = true
center = [ "audio_visualizer", "clock", "audio_visualizer" ]

# smart_auto_hide    = true
# reserve_space      = false

# remove rounding
# capsule            =  false
# radius               = 0
# radius_top_left      = 0
# radius_top_right     = 0
# radius_bottom_left   = 0
# radius_bottom_right  = 0
capsule_radius       = 5     # only matters if capsule = true




end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "battery",
    "battery-threshold",
    "session"
]
font_weight = 400

[audio]
enable_overdrive = true

[shell.launcher.dmenu.entry.emacs]
command = "printf 'Emacs Start\nEmacs Stop daemon\n'"
label = "Emacs"
glyph = "terminal"
global = true
exec = "case \"{selection}\" in Start*) emacs --daemon ;; Stop*) emacsclient -e '(kill-emacs)' ;; esac"

[shell.launcher.dmenu.entry.kill]
command = '''hyprctl clients -j | jq -r '.[] | "\(.class) - \(.title | gsub("[^A-Za-z0-9 ._-]"; ""))\t\(.pid)"' '''
label = "Kill window"
prefix = "kill"
glyph = "x"
global = false
exec = '''kill -9 "$(echo "{selection}" | grep -o '[0-9]*$')"'''

[shell.launcher.dmenu.entry.shell]
label = "run"
prefix = "run"
glyph = "run"
global = true
freeform = true
exec = "{query}"

[osd.kinds]
media = false

[control_center.calendar]
show_events_card = false

[location]
address = "tamil nadu trichy"

[weather]
refresh_minutes = 20

[shell]
polkit_agent = true
telemetry_enabled = true
app_icon_color = "on_surface"
font_family = "Noto Sans"
lang = "en"
screen_time_enabled = true
clipboard_auto_paste  = "off"          # off | auto | ctrl_v | ctrl_shift_v | shift_insert

[shell.screenshot]
annotate = true
directory = "~/Pictures/Screenshots/"
freeze_screen = true


[shell.launcher]
layout = "simple"
categories = false

[shell.panel]
launcher_placement = "floating"
transparency_mode = "soft"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "wonderful-surya-scaled-vib"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "alacritty", "emacs", "gtk3", "gtk4", "hyprland", "niri", "qt" ]
community_ids = [ "papirus-icons" ]

[widget.battery]
enabled = false

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clock]
font_weight = 700
format = "{:%I:%M %p}"
timezone = "Asia/Kolkata"
tooltip_format = "{:%A, %d %B %Y - %H:%M}"

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.network]
enabled = false

[widget.volume]
enabled = false

[widget.weather]
enabled = false

[widget.wallpaper]
enabled = false

[widget.battery-threshold]
enabled = false
type = "damian-ds7/battery-threshold:battery-threshold"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-widget-0000000000000001", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 540.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.29999999999999999
        input_radius = 0.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 475.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        background_radius = 0


[dock]
background_opacity = 0.7
position = "right"
enabled = true
reserve_space = false
smart_auto_hide = true
show_dots = true
show_instance_count = false

# remove radious
# radius               = 0
# radius_top_left      = 0
# radius_top_right     = 0
# radius_bottom_left   = 0
# radius_bottom_right  = 0
# concave_edge_corners = false


[hot_corners]
enabled = true

[hot_corners.top_left]
action = "window_switcher"




[plugins]
enabled = [ "damian-ds7/battery-threshold" ]
