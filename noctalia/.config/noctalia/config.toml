config_version = 13

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[backdrop]
enabled        = true
blur_intensity = 0.5    # 0.0 (no blur) to 1.0 (max blur)
tint_intensity = 0.4    # 0.0 (no tint) to 1.0 (opaque tint)

[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.7
position             = "top"
margin_ends          =  100   
margin_edge          = 8
concave_edge_corners = true
center = [ "clock", "audio_visualizer" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "battery",
    "battery-threshold",
    "session"
]
font_weight = 400

[audio]
enable_overdrive = true


[osd.kinds]
media = false

[control_center.calendar]
show_events_card = false

[location]
address = "tamil nadu trichy"

[weather]
refresh_minutes = 20

[shell]
polkit_agent = true
telemetry_enabled = true
app_icon_color = "on_surface"
font_family = "Noto Sans"
lang = "en"
screen_time_enabled = true


[shell.launcher]
categories = false

[shell.panel]
launcher_placement = "floating"
transparency_mode = "soft"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "wonderful-surya-scaled-vib"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "alacritty", "emacs", "gtk3", "gtk4", "hyprland", "niri", "qt" ]
community_ids = [ "papirus-icons" ]


[widget.battery]
enabled = false

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clock]
font_weight = 700
format = "{:%I:%M %p}"
timezone = "Asia/Kolkata"
tooltip_format = "{:%A, %d %B %Y - %H:%M}"

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.network]
enabled = false

[widget.volume]
enabled = false

[widget.weather]
enabled = false

[widget.wallpaper]
enabled = false

[widget.battery-threshold]
enabled = false
type = "damian-ds7/battery-threshold:battery-threshold"


[dock]
background_opacity = 0.7
enabled = true
reserve_space = false
smart_auto_hide = true

[plugins]
enabled = [ "damian-ds7/battery-threshold" ]
